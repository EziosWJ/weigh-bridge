name: PostgreSQL and release gate

on:
  workflow_dispatch:
    inputs:
      legacy_sync:
        description: Run historical central/site synchronization regression
        type: boolean
        default: false
  push:
    paths:
      - "server/**"
      - "web/**"
      - "Taskfile.yml"
      - "scripts/**"
      - ".github/workflows/database-compatibility.yml"
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "Taskfile.yml"
      - "scripts/**"
      - ".github/workflows/database-compatibility.yml"

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  embedded-release:
    name: Embedded frontend release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Prepare embedded frontend
        run: node scripts/prepare-webui.mjs
      - name: Verify embedded release
        working-directory: server
        run: |
          go test -tags=embedweb ./...
          go vet -tags=embedweb ./...
          go build -tags=embedweb -trimpath -o ../bin/weighbridge-server ./cmd/api

  backend-check:
    name: Backend unit tests and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Run backend check
        run: |
          go test ./...
          go vet ./...

  postgres-contract:
    name: Local PostgreSQL integration contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Set up Node for notification capacity browser test
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare notification capacity browser dependencies
        working-directory: web
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
      - name: Run local PostgreSQL integration contract
        run: >-
          go test -tags=integration ./integration
          -count=1 -timeout=20m

  legacy-sync-regression:
    name: Historical central/site synchronization (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_sync }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Run historical synchronization regression
        run: >-
          go test -tags=integration,legacy_sync ./integration
          -run '^TestPostgresLegacyCentralSync$' -count=1 -timeout=5m
