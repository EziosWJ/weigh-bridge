# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

env:
  APP_ENV: dev
  GOCACHE: '{{.ROOT_DIR}}/.task/go-build'

# 有 desc 的任务出现在默认常用列表；专项任务只保留 summary，仍可直接调用。
# task tasks（或 task --list-all）查看全部；task <任务> --summary 查看用途和步骤。
tasks:
  default:
    summary: Show available tasks
    cmds:
      - task --list
    silent: true

  tasks:
    desc: 查看全部任务（含设备、部署和专项验证）
    cmds:
      - task --list-all
    silent: true

  init:
    desc: 生成本地开发配置（保留已有配置）
    preconditions:
      - sh: node --version
        msg: '需要 Node.js；安装后重新运行 task init。'
    cmds:
      - node scripts/dev-setup.mjs init {{.CLI_ARGS}}

  doctor:
    desc: 检查开发工具、配置和数据库连接
    preconditions:
      - sh: node --version
        msg: '需要 Node.js；安装后重新运行 task doctor。'
    cmds:
      - node scripts/dev-setup.mjs doctor {{.CLI_ARGS}}

  dev:setup:test:
    summary: Run development setup bootstrap command tests
    cmds:
      - node --test scripts/dev-setup.test.mjs

  db:migrate:
    desc: 执行 PostgreSQL schema 和 seed 迁移
    dir: server
    cmds:
      - go run ./cmd/migrate up --kind all

  db:migrate:schema:
    summary: Apply schema migrations only
    dir: server
    cmds:
      - go run ./cmd/migrate up --kind schema

  db:migrate:seed:
    summary: Apply seed migrations only
    dir: server
    cmds:
      - go run ./cmd/migrate up --kind seed

  api:
    summary: Start the Go API
    dir: server
    cmds:
      - go run ./cmd/api

  web:
    summary: Start the React development server
    dir: web
    cmds:
      - npm run dev

  agent:mock:
    desc: 启动独立设备模拟器（8090）
    dir: server
    cmds:
      - go run ./cmd/agent-mock {{.CLI_ARGS}}

  agent:build:
    summary: Build the standalone Agent mock executable
    dir: server
    cmds:
      - go build -trimpath -o ../bin/weighbridge-agent-mock ./cmd/agent-mock

  agent:printer:build:
    summary: Build the Linux amd64 SK-820 printer Agent
    dir: server
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
    cmds:
      - go build -trimpath -o ../bin/weighbridge-agent-printer ./cmd/agent-printer

  agent:maintenance:build:
    summary: Build the offline local Agent printer maintenance service
    dir: server
    cmds:
      - go build -trimpath -o ../bin/weighbridge-agent-maintenance ./cmd/agent-maintenance

  agent:maintenance:smoke:
    summary: Verify local maintenance in Chromium with isolated fake CUPS/systemd commands
    deps:
      - agent:maintenance:build
      - agent:printer:build
    cmds:
      - node scripts/check-agent-maintenance.mjs

  host:collector:
    summary: Start the Linux host resource collector; pass flags through CLI_ARGS
    dir: server
    cmds:
      - go run ./cmd/host-collector {{.CLI_ARGS}}

  host:build:
    summary: Build the Linux host resource collector
    dir: server
    cmds:
      - go build -trimpath -o ../bin/weighbridge-host-collector ./cmd/host-collector

  host:smoke:
    summary: Verify real Linux host samples, Unix socket and collector restart
    deps:
      - host:build
    cmds:
      - python3 scripts/check-host-collector.py {{.CLI_ARGS}}

  monitoring:smoke:docker:
    summary: Verify native and isolated Docker APIs using temporary data (requires task build)
    cmds:
      - python3 scripts/check-monitoring-docker.py {{.CLI_ARGS}}

  dev:
    desc: 补齐开发配置、执行迁移并启动 API 和 Web
    cmds:
      - task: init
      - task: db:migrate
      - task --parallel api web

  backend:test:
    summary: Run backend unit tests
    dir: server
    cmds:
      - go test ./...

  backend:swagger:
    summary: Regenerate API documentation from handler contracts
    dir: server
    cmds:
      - go run github.com/swaggo/swag/cmd/swag@v1.8.12 init -g cmd/api/main.go --parseInternal --output docs

  backend:windows:
    summary: Cross-build Windows amd64 API, migrations and monitoring tests (PostgreSQL, no CGO)
    dir: server
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '0'
    cmds:
      - go build -trimpath -o ../bin/weighbridge-server-windows-amd64.exe ./cmd/api
      - go build -trimpath -o ../bin/weighbridge-migrate-windows-amd64.exe ./cmd/migrate
      - go test -c -o ../.task/windows-monitoring.test.exe ./internal/monitoring
      - go vet ./cmd/api ./internal/monitoring

  monitoring:smoke:windows:
    summary: Run read-only native monitoring verification on Windows (or WSL with Windows interop)
    deps:
      - backend:windows
    cmds:
      - '"{{.ROOT_DIR}}/.task/windows-monitoring.test.exe" -test.timeout 30s -test.v -test.run "TestWindows|TestInterfaceAddressesKeepHostIPAndPrefix|TestNetworkAddressesThroughHTTP|TestDisabledMonitoringHTTPAndSampling" -windows-smoke'

  backend:notifications:
    summary: Run announcement, notification, SSE and capacity integration contracts
    dir: server
    cmds:
      - go test -tags=integration ./integration -run 'Notification|Announcement' -count=1

  backend:integration:
    summary: Run current local PostgreSQL integration tests
    dir: server
    cmds:
      - go test -tags=integration ./integration -count=1 -timeout=20m

  backend:integration:legacy-sync:
    summary: Run historical central/site synchronization regression tests (optional)
    dir: server
    cmds:
      - go test -tags=integration,legacy_sync ./integration -run '^TestPostgresLegacyCentralSync$' -count=1 -timeout=5m

  db:integration:postgres:
    summary: Run the current local PostgreSQL database integration contract
    dir: server
    cmds:
      - go test -tags=integration ./integration -count=1 -timeout=20m

  db:check:
    desc: 运行后端检查和 PostgreSQL 集成测试（需 Docker）
    deps:
      - backend:check
      - db:integration:postgres

  backend:check:
    summary: Run backend tests and static checks
    dir: server
    cmds:
      - go test ./...
      - go vet ./...

  frontend:lint:
    summary: Run frontend lint
    dir: web
    cmds:
      - npm run lint

  frontend:build:
    summary: Build the frontend
    dir: web
    cmds:
      - npm run build

  frontend:notifications:
    summary: Run announcement and notification browser verification
    dir: web
    cmds:
      - npm run test:notifications

  frontend:monitoring:
    summary: Run server monitoring browser verification
    dir: web
    cmds:
      - npm run test:monitoring

  check:
    desc: 运行后端检查和前端 lint/build
    deps:
      - dev:setup:test
      - backend:check
      - frontend:lint
      - frontend:build

  build:
    desc: 构建内嵌 Web 的本机发布二进制
    deps:
      - frontend:build
    dir: server
    vars:
      GOEXE:
        sh: go env GOEXE
    cmds:
      - node ../scripts/prepare-webui.mjs
      - go build -tags=embedweb -trimpath -o ../bin/weighbridge-server{{.GOEXE}} ./cmd/api
      - go build -trimpath -o ../bin/weighbridge-migrate{{.GOEXE}} ./cmd/migrate
      - go build -trimpath -o ../bin/weighbridge-host-collector{{.GOEXE}} ./cmd/host-collector

  build:check:
    summary: Build the release and verify tests and vet with embedded frontend assets
    deps:
      - build
    dir: server
    cmds:
      - go test -tags=embedweb ./...
      - go vet -tags=embedweb ./...

  standalone:package:
    aliases: [package]
    desc: 打包本厂三服务（VERSION=<唯一版本>）
    deps:
      - frontend:build
    dir: server
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
    vars:
      VERSION: '{{.VERSION | default ""}}'
    cmds:
      - node ../scripts/prepare-webui.mjs
      - go build -tags=embedweb -trimpath -o ../bin/weighbridge-server ./cmd/api
      - go build -trimpath -o ../bin/weighbridge-migrate ./cmd/migrate
      - go build -trimpath -o ../bin/weighbridge-agent-printer ./cmd/agent-printer
      - go build -trimpath -o ../bin/weighbridge-standalone-init ./cmd/standalone-init
      - node ../scripts/package-standalone.mjs '{{.VERSION}}'

  standalone:install:smoke:
    summary: Verify an unpacked standalone package in temporary directories (pass PACKAGE_DIR=<path>)
    requires:
      vars: [PACKAGE_DIR]
    cmds:
      - node scripts/check-standalone-install.mjs '{{.PACKAGE_DIR}}'

  standalone:release:smoke:
    summary: Verify packaged API startup and restart with isolated PostgreSQL (pass PACKAGE_DIR=<path>)
    requires:
      vars: [PACKAGE_DIR]
    cmds:
      - node scripts/check-standalone-release.mjs '{{.PACKAGE_DIR}}'

  test:
    summary: Run the default test suite
    deps:
      - backend:test
