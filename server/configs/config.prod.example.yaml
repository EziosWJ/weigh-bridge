# 生产环境配置模板，统一使用 PostgreSQL。
# 实际 configs/config.prod.yaml 以只读文件或挂载方式由部署系统提供，不提交 Git。
# 所有占位符值必须在部署时替换为真实值。
swagger:
  enabled: false

database:
  # PostgreSQL is the only supported Server database.
  driver: postgres
  url: postgres://db.example.internal:5432/weighbridge?sslmode=require
  username: change-me
  password: change-me

jwt:
  secret: change-me

auth:
  login_guard:
    ip_max_attempts: 20
    username_max_attempts: 5

log:
  level: info
  format: json
