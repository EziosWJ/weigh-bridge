<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Mock · 设备控制台</title><style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#1f2937;background:#f5f7fa;font-size:14px}*{box-sizing:border-box}body{margin:0}header{padding:20px 24px;background:white;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px;margin:0 0 4px}p{margin:8px 0;color:#4b5563}main{max-width:1200px;margin:auto;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px}section{background:white;border:1px solid #e5e7eb;border-radius:10px;padding:20px}h2{font-size:18px;margin:0 0 16px}label{display:block;font-weight:600;margin:12px 0 6px}input,select,button{font:inherit;border:1px solid #e5e7eb;border-radius:8px;min-height:36px;padding:7px 12px}input,select{width:100%;background:white}button{cursor:pointer;background:white;color:#1f2937}button:hover{background:#f5f7fa}button:disabled{opacity:.5;cursor:wait}button.primary{background:#1677ff;color:white;border-color:#1677ff}button.danger{color:#dc2626}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #1677ff;outline-offset:2px}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.status{padding:6px 12px;border-radius:8px;background:#f5f7fa}.readout{font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;color:#1f2937}.readout small{font-size:16px;font-weight:400}.wide{grid-column:1/-1}canvas{width:100%;height:140px;background:#f5f7fa;border-radius:8px}pre{overflow:auto;max-height:280px;padding:12px;background:#f5f7fa;font-size:13px;white-space:pre-wrap;word-break:break-word}.print{border-top:1px solid #e5e7eb;padding:16px 0}.error{color:#dc2626}#notice{min-height:22px}a{color:#1677ff}.muted{color:#6b7280}@media(max-width:720px){main{grid-template-columns:1fr;padding:16px;gap:16px}header{padding:16px;align-items:flex-start;flex-direction:column}.wide{grid-column:auto}}
.sheet-scroll{overflow-x:auto}.paper-sheet{box-sizing:border-box;width:210mm;min-height:99mm;padding:6mm 8mm;background:white;color:black;font:10pt/1.5 "SimSun","Noto Serif CJK SC",serif}.paper-title{text-align:center;font-size:16pt;font-weight:bold}.paper-marks{min-height:5mm;margin:0 0 2mm;text-align:right;font-weight:bold}.paper-rows{border:.25mm solid black}.paper-row{display:flex;border-bottom:.25mm solid black}.paper-row:last-child{border-bottom:0}.paper-field{flex:1;min-width:0;padding:2mm;border-right:.25mm solid black;overflow-wrap:anywhere}.paper-field:last-child{border-right:0}
</style></head><body><header><div><h1>Agent Mock</h1><span class="muted">开发与上线前测试 · 设备模拟控制台</span></div><span id="connection" role="status" class="status">正在连接…</span></header><main>
<section><h2>称重仪表</h2><div class="readout"><span id="weight">0</span> <small>吨</small></div><p id="device" role="status">等待报文</p><canvas id="chart" width="960" height="200" aria-label="最近重量变化曲线"></canvas><label for="target">目标重量（吨）</label><input id="target" type="number" min="0.001" step="0.001" value="30"><div class="row"><button class="primary" id="up">模拟上磅</button><button data-action="down">模拟下磅</button><button data-action="unstable">强制失稳</button><button data-action="stable">恢复稳定</button></div><p>上磅后持续发送 4 秒波动重量，再转为稳定；每 0.5 秒更新。</p><div class="row"><button class="danger" data-action="fault">设备故障</button><button data-action="recover">恢复设备</button><button class="danger" data-action="disconnect">断开连接</button><button data-action="connect">恢复连接</button></div></section>
<section><h2>识别候选与现场图片</h2><label for="plate">识别候选车牌</label><input id="plate" value="晋A12345" maxlength="10"><div class="row"><button id="plate-send">发送识别候选</button><button id="plate-fail">模拟识别失败</button></div><p>系统收到候选后仍由操作员核对；错误候选可直接输入。</p><label for="front">车头视角图片</label><input type="file" id="front" accept="image/png,image/jpeg"><label for="rear">车尾视角图片</label><input type="file" id="rear" accept="image/png,image/jpeg"><p>默认使用内置示例图；选择文件后上传替换。每次采集将保存独立抓拍引用。</p><p id="identity" class="muted"></p><p id="notice" role="status"></p><p id="error" class="error" role="alert"></p></section>
<section class="wide"><h2>打印任务</h2><p>系统发起打印后，任务会出现在这里。可回报成功或失败；暂不操作即保持结果未知。不会驱动物理打印机。</p><div id="prints"><p class="muted">尚未收到打印任务</p></div></section></main><script>
const $=id=>document.getElementById(id);let lastPrints='';let polling=false;
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());$('notice').textContent='操作已发送';}
async function run(fn){try{$('notice').textContent='正在发送…';await fn()}catch(e){$('notice').textContent=e.message}}
$('up').onclick=()=>run(()=>post('/api/control',{action:'up',weight:$('target').value}));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>run(()=>post('/api/control',{action:b.dataset.action})));$('plate-send').onclick=()=>run(()=>post('/api/control',{action:'plate',candidate:$('plate').value,failed:false}));$('plate-fail').onclick=()=>run(()=>post('/api/control',{action:'plate',candidate:'',failed:true}));
for(const view of ['front','rear'])$(view).onchange=()=>run(async()=>{const file=$(view).files[0];if(!file)return;const data=new FormData();data.set('file',file);data.set('view',view);const r=await fetch('/api/images',{method:'POST',body:data});if(!r.ok)throw Error(await r.text());$('notice').textContent='图片已更新'});
function draw(history){const canvas=$('chart'),c=canvas.getContext('2d');c.clearRect(0,0,960,200);if(!history.length)return;const values=history.map(s=>Number(s.weight)),min=Math.min(...values),max=Math.max(...values),span=Math.max(max-min,.1);c.strokeStyle='#1677ff';c.lineWidth=3;c.beginPath();values.forEach((v,i)=>{const x=16+i*928/Math.max(values.length-1,1),y=184-(v-min)*168/span;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}
function paperSheet(sheet){const scroll=document.createElement('div');scroll.className='sheet-scroll';const paper=document.createElement('div');paper.className='paper-sheet';paper.setAttribute('aria-label','精简过磅单');const title=document.createElement('div');title.className='paper-title';title.textContent=sheet.title;const marks=document.createElement('div');marks.className='paper-marks';marks.textContent=sheet.marks.join(' · ');const rows=document.createElement('div');rows.className='paper-rows';for(const fields of sheet.rows){const row=document.createElement('div');row.className='paper-row';for(const field of fields){const cell=document.createElement('div');cell.className='paper-field';cell.textContent=field.label+'：'+field.value;row.append(cell)}rows.append(row)}paper.append(title,marks,rows);scroll.append(paper);return scroll}
function printRows(rows){const key=JSON.stringify(rows);if(key===lastPrints)return;lastPrints=key;const root=$('prints');root.replaceChildren();if(!rows.length){root.textContent='尚未收到打印任务';return}for(const row of [...rows].reverse()){const section=document.createElement('div');section.className='print';const title=document.createElement('h3');title.textContent=`打印尝试 #${row.attemptId} · ${row.status==='unknown'?'待回报':row.status==='printed'?'成功':'失败'}`;const pre=document.createElement('pre');pre.textContent=JSON.stringify(row.ticket,null,2);const controls=document.createElement('div');controls.className='row';for(const [status,label]of [['printed','回报成功'],['failed','回报失败']]){const button=document.createElement('button');button.textContent=label;button.disabled=row.status!=='unknown';button.onclick=()=>run(()=>post('/api/prints',{attemptId:row.attemptId,status,reason:status==='failed'?'模拟打印失败':''}));controls.append(button)}const raw=document.createElement('details');const summary=document.createElement('summary');summary.textContent='查看原始打印任务';raw.append(summary,pre);section.append(title);if(row.ticket.printSheet)section.append(paperSheet(row.ticket.printSheet));section.append(raw,controls);root.append(section)}}
async function poll(){if(polling)return;polling=true;try{const r=await fetch('/api/state');if(!r.ok)throw Error('控制台连接失败');const data=await r.json();$('connection').textContent=data.online?'Agent 已连接':'Agent 未连接';$('weight').textContent=data.state.weight;$('device').textContent=(data.state.deviceOk?'设备正常':'设备故障')+' · '+(data.state.stable?'重量稳定':'重量未稳定');$('identity').textContent=`${data.siteName || "厂区名称未配置"} · ${data.scaleName || "地磅 " + data.scaleId} · Agent ${data.agentId}`;$('error').textContent=data.error;draw(data.history);printRows(data.prints)}catch(e){$('connection').textContent='控制台离线';$('error').textContent=e.message}finally{polling=false}}
poll();setInterval(poll,500);
</script></body></html>
